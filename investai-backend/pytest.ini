# Pytest configuration.
#
# `testpaths` is the load-bearing line. The repository keeps a `scratch/`
# directory of hand-run diagnostic scripts, and three of them are named
# `test_*.py`, so a bare `pytest` used to collect them. That is not merely
# untidy: scratch/test_registration_sync.py opens a SessionLocal and does an
# INSERT + DELETE against the `users` table, so running the test suite mutated
# the live database. Others reach out to Supabase and the email provider, which
# made the suite slow and dependent on the network. They also swallow their own
# exceptions and print "FAILED", so pytest reported them as passing regardless.
#
# Restricting collection to tests/ keeps `pytest` offline, deterministic, and
# read-only. The scratch scripts are still there and still run directly:
#     python scratch/test_registration_sync.py
[pytest]
testpaths = tests

# Belt and braces for `pytest .`, where testpaths is ignored.
norecursedirs = scratch alembic .git __pycache__ *.egg-info venv .venv

# Show why something was skipped instead of a bare 's'.
addopts = -ra
